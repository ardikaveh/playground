  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #04040f;

      color: #fff;
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }

    /* ── Canvas starfield ──────────────────────────────────────── */
    #star-canvas {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 0; pointer-events: none;
    }

    /* ── Header ─────────────────────────────────────────────── */
    #header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      padding: 18px 20px 24px;
      background: linear-gradient(to bottom, rgba(4,4,15,1) 55%, transparent);
      pointer-events: none;
    }
    #header h1 {
      font-size: 20px; font-weight: 800; letter-spacing: -0.4px;
      background: linear-gradient(130deg, #fff 0%, #a5b4fc 60%, #818cf8 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    #header p {
      font-size: 11px; color: rgba(255,255,255,0.38);
      margin-top: 3px; letter-spacing: 0.3px;
    }

    /* ── Search bar ────────────────────────────────────────────── */
    #search-wrap {
      position: fixed; top: 14px; right: 16px; z-index: 110;
      pointer-events: all;
    }
    #search-input {
      width: 140px; padding: 7px 12px 7px 30px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 20px; color: #fff;
      font-size: 12px; outline: none;
      backdrop-filter: blur(12px);
      transition: width 0.25s, background 0.15s;
    }
    #search-input::placeholder { color: rgba(255,255,255,0.35); }
    #search-input:focus { width: 180px; background: rgba(255,255,255,0.12); }
    #search-icon {
      position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
      width: 14px; height: 14px;
      fill: none; stroke: rgba(255,255,255,0.45); stroke-width: 2;
      stroke-linecap: round; stroke-linejoin: round;
      pointer-events: none;
    }

    /* ── Nav / Back ──────────────────────────────────────────── */
    #nav-bar {
      position: fixed; top: 68px; left: 16px; right: 16px; z-index: 100;
      display: flex; align-items: center; gap: 8px;
      pointer-events: none;
    }
    #back-btn {
      display: none; align-items: center; gap: 5px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 20px; padding: 6px 14px;
      font-size: 13px; color: #fff; cursor: pointer;
      pointer-events: all;
      backdrop-filter: blur(12px);
      transition: background 0.15s;
    }
    #back-btn:active { background: rgba(255,255,255,0.15); }
    #back-btn svg { width: 13px; height: 13px; flex-shrink: 0; }
    #nav-label {
      font-size: 13px; font-weight: 600;
      color: rgba(255,255,255,0.75);
      opacity: 0; transition: opacity 0.3s;
    }

    /* ── Main SVG ────────────────────────────────────────────── */
    #viz { display: block; width: 100%; height: 100%; position: relative; z-index: 1; }

    /* ── Tech text readability ───────────────────────────────── */
    .tech-label {
      paint-order: stroke fill;
      stroke: rgba(0,0,0,0.5);
      stroke-width: 2px;
    }

    /* ── Legend strip ────────────────────────────────────────── */
    #legend {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
      padding: 10px 12px 18px;
      background: linear-gradient(to top, rgba(4,4,15,0.95) 60%, transparent);
      display: flex; gap: 7px;
      overflow-x: auto; scrollbar-width: none;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
    }
    #legend::-webkit-scrollbar { display: none; }
    .leg-chip {
      flex-shrink: 0; scroll-snap-align: start;
      display: flex; align-items: center; gap: 5px;
      padding: 5px 11px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.11);
      border-radius: 20px; font-size: 11px; font-weight: 500;
      cursor: pointer; white-space: nowrap;
      transition: background 0.15s, border-color 0.15s;
    }
    .leg-chip:active { background: rgba(255,255,255,0.13); }
    .leg-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

    /* ── Detail panel ────────────────────────────────────────── */
    #panel {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 300;
      background: rgba(10, 10, 24, 0.97);
      border-top: 1px solid rgba(255,255,255,0.09);
      border-radius: 22px 22px 0 0;
      padding: 0 22px 44px;
      transform: translateY(110%);
      transition: transform 0.38s cubic-bezier(0.32, 0.72, 0, 1);
      backdrop-filter: blur(24px);
      box-shadow: 0 -8px 32px rgba(0,0,0,0.5);
      max-height: 72vh; overflow-y: auto;
    }
    #panel.open { transform: translateY(0); }
    #panel::-webkit-scrollbar { width: 4px; }
    #panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }

    #panel-handle {
      width: 38px; height: 4px;
      background: rgba(255,255,255,0.18);
      border-radius: 2px;
      margin: 14px auto 18px;
    }
    #panel-cat-row {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 8px;
    }
    #panel-cat-dot { width: 9px; height: 9px; border-radius: 50%; }
    #panel-cat-name { font-size: 11px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; opacity: 0.55; }
    #panel-title { font-size: 30px; font-weight: 800; letter-spacing: -0.6px; margin-bottom: 6px; line-height: 1.1; }
    #panel-company { font-size: 14px; color: rgba(255,255,255,0.5); margin-bottom: 14px; }
    #panel-desc { font-size: 15px; line-height: 1.65; color: rgba(255,255,255,0.72); margin-bottom: 20px; }

    #panel-tags { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 22px; }
    .p-tag {
      padding: 4px 11px; border-radius: 20px;
      font-size: 11px; font-weight: 600; letter-spacing: 0.2px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.8);
    }
    .p-tag.oss {
      background: rgba(52,211,153,0.12);
      border-color: rgba(52,211,153,0.28);
      color: #6ee7b7;
    }

    #panel-metrics {
      display: flex; gap: 12px;
      padding: 16px; border-radius: 14px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07);
      margin-bottom: 16px;
    }
    #panel-score-num { font-size: 42px; font-weight: 900; line-height: 1; letter-spacing: -1px; }
    #panel-score-label { font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 3px; }
    #bar-wrap { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 8px; }
    #score-bar-bg {
      height: 6px; border-radius: 3px;
      background: rgba(255,255,255,0.1); overflow: hidden;
    }
    #score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.6s ease; }
    #panel-year { font-size: 12px; color: rgba(255,255,255,0.38); }

    #panel-close {
      position: absolute; top: 18px; right: 20px;
      width: 28px; height: 28px;
      background: rgba(255,255,255,0.1); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 15px; color: rgba(255,255,255,0.7);
      border: none;
    }
    #panel-close:active { background: rgba(255,255,255,0.2); }

    /* ── Related techs in panel ─────────────────────────────── */

    #panel-related-label {
      font-size: 11px; font-weight: 600; letter-spacing: 0.8px;
      text-transform: uppercase; color: rgba(255,255,255,0.35);
      margin-bottom: 10px;
    }
    #panel-related-chips { display: flex; flex-wrap: wrap; gap: 7px; }
    .related-chip {
      padding: 6px 13px; border-radius: 20px;
      font-size: 12px; font-weight: 600;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.75);
      cursor: pointer; white-space: nowrap;
      transition: background 0.15s;
    }
    .related-chip:active { background: rgba(255,255,255,0.14); }

    /* ── Pulse animation for high-impact items ─────────────── */
    @keyframes subtle-pulse {
      0%, 100% { opacity: 0.82; }
      50% { opacity: 0.95; }
    }
    .high-impact { animation: subtle-pulse 3s ease-in-out infinite; }

    /* ── Float animation ───────────────────────────────────── */
    @keyframes float {
      0%, 100% { transform: translate(var(--tx), var(--ty)); }
      50% { transform: translate(calc(var(--tx) + 1px), calc(var(--ty) - 2px)); }
    }

    /* ── Reduced motion ────────────────────────────────────── */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
      #viz, #viz * { filter: none !important; }
    }
  </style>
</head>

//  3. D3 SETUP — layout, pack, dimensions
// ═══════════════════════════════════════════════════════════════════
let W = window.innerWidth;
let H = window.innerHeight;

const svg = d3.select("#viz").attr("width", W).attr("height", H);
const defs = svg.append("defs");
var gMain = svg.append("g");
var hierarchy, catNodes;

function buildDefs() {
  defs.selectAll("*").remove();
  CATS.forEach(function(cat) {
    // glow filter per category
    var f = defs.append("filter")
      .attr("id", "glow-" + cat.id)
      .attr("x", "-60%").attr("y", "-60%")
      .attr("width", "220%").attr("height", "220%");
    f.append("feGaussianBlur").attr("stdDeviation", "5").attr("result", "blur");
    var fm = f.append("feMerge");
    fm.append("feMergeNode").attr("in", "blur");
    fm.append("feMergeNode").attr("in", "SourceGraphic");

    // ring glow filter
    var f2 = defs.append("filter")
      .attr("id", "ringlow-" + cat.id)
      .attr("x", "-20%").attr("y", "-20%")
      .attr("width", "140%").attr("height", "140%");
    f2.append("feGaussianBlur").attr("stdDeviation", "8").attr("result", "blur");
    var fm2 = f2.append("feMerge");
    fm2.append("feMergeNode").attr("in", "blur");
    fm2.append("feMergeNode").attr("in", "SourceGraphic");

    // radial gradient for category fill
    var rg = defs.append("radialGradient")
      .attr("id", "catgrad-" + cat.id)
      .attr("cx", "40%").attr("cy", "35%").attr("r", "65%");
    rg.append("stop").attr("offset", "0%").attr("stop-color", cat.color).attr("stop-opacity", 0.18);
    rg.append("stop").attr("offset", "100%").attr("stop-color", cat.glow).attr("stop-opacity", 0.04);
  });
}

function buildHierarchy() {
  var PADDING = 48;
  var packW = W;
  var packH = H - PADDING;

  hierarchy = d3.hierarchy({
    name: "root",
    children: CATS.map(function(c) {
      return Object.assign({}, c, {
        children: c.techs.map(function(t) {
          return Object.assign({}, t, { value: t.score });
        })
      });
    })
  })
    .sum(function(d) { return d.value || 0; })
    .sort(function(a, b) { return b.value - a.value; });

  d3.pack().size([packW, packH - 20]).padding(function(d) { return d.depth === 0 ? 8 : 5; })(hierarchy);

  hierarchy.descendants().forEach(function(d) { d.y += PADDING * 0.5 + 14; });
  catNodes = hierarchy.children;
}

// ═══════════════════════════════════════════════════════════════════
//  4. DRAWING — canvas starfield, categories, techs, labels
// ═══════════════════════════════════════════════════════════════════
function drawStarfield() {
  var canvas = document.getElementById("star-canvas");
  canvas.width = W;
  canvas.height = H;
  var ctx = canvas.getContext("2d");
  ctx.clearRect(0, 0, W, H);
  for (var i = 0; i < 220; i++) {
    var x = Math.random() * W;
    var y = Math.random() * H;
    var r = Math.random() * 1.3 + 0.1;
    var a = Math.random() * 0.45 + 0.05;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255,255,255," + a + ")";
    ctx.fill();
  }
}

function drawAll() {
  gMain.selectAll("*").remove();

  // category rings
  var catRings = gMain.append("g").attr("class", "cat-rings");
  catNodes.forEach(function(cn) {
    var cat = CATS.find(function(c) { return c.id === cn.data.id; });
    // outer glow ring
    catRings.append("circle")
      .attr("cx", cn.x).attr("cy", cn.y).attr("r", cn.r + 2)
      .attr("fill", "none")
      .attr("stroke", cat.color)
      .attr("stroke-width", 1.5)
      .attr("opacity", 0.25)
      .attr("filter", "url(#ringlow-" + cat.id + ")");
    // radial gradient fill
    catRings.append("circle")
      .attr("cx", cn.x).attr("cy", cn.y).attr("r", cn.r)
      .attr("fill", "url(#catgrad-" + cat.id + ")");
  });

  // tech bubbles
  var techGroup = gMain.append("g").attr("class", "techs");
  hierarchy.descendants().filter(function(d) { return d.depth === 2; }).forEach(function(d) {
    var cat = CATS.find(function(c) { return c.id === d.parent.data.id; });
    var g = techGroup.append("g")
      .attr("class", "tech-node")
      .attr("data-id", d.data.name)
      .style("cursor", "pointer");

    var bubble = g.append("circle")
      .attr("cx", d.x).attr("cy", d.y).attr("r", d.r)
      .attr("fill", cat.color)
      .attr("opacity", 0.82)
      .attr("filter", "url(#glow-" + cat.id + ")")
      .attr("stroke", "rgba(255,255,255,0.15)")
      .attr("stroke-width", 0.8);

    // pulse for high-impact items
    if (d.data.score >= 90) {
      bubble.classed("high-impact", true);
    }

    // label
    if (d.r >= 14) {
      g.append("text")
        .attr("class", "tech-label")
        .attr("x", d.x).attr("y", d.y)
        .attr("text-anchor", "middle")
        .attr("dominant-baseline", "central")
        .attr("fill", "white")
        .attr("font-size", Math.max(Math.min(d.r * 0.45, 11), 7))
        .attr("font-weight", "700")
        .attr("pointer-events", "none")
        .text(shortenName(d.data.name));
    }
  });

  // category labels
  var catLabelGroup = gMain.append("g").attr("class", "cat-labels").attr("pointer-events", "none");
  catNodes.forEach(function(cn) {
    var cat = CATS.find(function(c) { return c.id === cn.data.id; });
    var g = catLabelGroup.append("g");

    g.append("text")
      .attr("class", "tech-label")
      .attr("x", cn.x).attr("y", cn.y - cn.r * 0.18)
      .attr("text-anchor", "middle").attr("dominant-baseline", "central")
      .attr("font-size", Math.max(cn.r * 0.27, 14))
      .attr("fill", "white").attr("opacity", 0.88)
      .attr("font-weight", "800")
      .attr("letter-spacing", "-0.3px")
      .text(cat.emoji);

    var nameFontSize = Math.min(Math.max(cn.r * 0.12, 9), 13);
    g.append("text")
      .attr("class", "tech-label")
      .attr("x", cn.x).attr("y", cn.y + cn.r * 0.2)
      .attr("text-anchor", "middle").attr("dominant-baseline", "central")
      .attr("font-size", nameFontSize)
      .attr("fill", "white").attr("opacity", 0.65)
      .attr("font-weight", "600")
      .text(cat.name);
  });

  // invisible hit zones for categories
  var catHitGroup = gMain.append("g").attr("class", "cat-hits");
  catNodes.forEach(function(cn) {
    catHitGroup.append("circle")
      .attr("cx", cn.x).attr("cy", cn.y).attr("r", cn.r)
      .attr("fill", "transparent")
      .attr("data-catid", cn.data.id)
      .style("cursor", "pointer");
  });

  // ── Bind interaction events ──────────────────────────────
  bindCatHitEvents(catHitGroup);
  bindTechEvents(techGroup);
}

// ═══════════════════════════════════════════════════════════════════
//  5. ZOOM STATE
// ═══════════════════════════════════════════════════════════════════
var currentFocus = null;
var zoomed = false;
var currentView = null;

function resetView(animate) {
  currentView = [hierarchy.x, hierarchy.y, Math.max(W, H) * 1.3];
  applyView(currentView, animate);
}

function applyView(v, animate) {
  var scale = Math.min(W, H) / v[2];
  var tx = W / 2 - v[0] * scale;
  var ty = H / 2 - v[1] * scale;
  var t = gMain.transition().duration(animate ? 700 : 0).ease(d3.easeCubicInOut);
  t.attr("transform", "translate(" + tx + "," + ty + ") scale(" + scale + ")");
}

function zoomToNode(node) {
  var margin = node.depth === 1 ? 2.4 : 2;
  currentView = [node.x, node.y, node.r * margin];
  applyView(currentView, true);
}

function zoomOut() {
  resetView(true);
  currentFocus = null;
  zoomed = false;
  updateNav();
}

//  6. INTERACTION — zoom, panel, search
// ═══════════════════════════════════════════════════════════════════

// ── Category hit zone events ─────────────────────────────────────
function bindCatHitEvents(catHitGroup) {
  catHitGroup.selectAll("circle").on("pointerup", function(event) {
    if (isRightClick(event)) return;
    event.stopPropagation();
    if (isPanelOpen()) { closePanel(); return; }
    var catId = this.getAttribute("data-catid");
    var cn = catNodes.find(function(n) { return n.data.id === catId; });
    if (!cn) return;
    currentFocus = catId;
    zoomed = true;
    zoomToNode(cn);
    updateNav(catId);
  });
}

// ── Tech bubble events ───────────────────────────────────────────
function bindTechEvents(techGroup) {
  techGroup.selectAll(".tech-node").on("pointerup", function(event) {
    if (isRightClick(event)) return;
    event.stopPropagation();
    var name = this.getAttribute("data-id");
    var d = hierarchy.descendants().find(function(n) { return n.depth === 2 && n.data.name === name; });
    if (!d) return;
    openPanel(d.data, d.parent.data.id);
  });
}

// Background tap — close panel or zoom out
svg.on("pointerup", function(event) {
  if (isRightClick(event)) return;
  if (isPanelOpen()) { closePanel(); return; }
  if (zoomed) zoomOut();
});

// ── NAV ──────────────────────────────────────────────────────────
function updateNav(catId) {
  var backBtn = document.getElementById("back-btn");
  var navLabel = document.getElementById("nav-label");
  if (!catId) {
    backBtn.style.display = "none";
    navLabel.style.opacity = "0";
  } else {
    backBtn.style.display = "flex";
    var cat = CATS.find(function(c) { return c.id === catId; });
    navLabel.textContent = cat ? cat.emoji + "  " + cat.name : "";
    navLabel.style.opacity = "1";
  }
}

document.getElementById("back-btn").addEventListener("click", function(e) {
  e.stopPropagation();
  closePanel();
  zoomOut();
});

// ── DETAIL PANEL ─────────────────────────────────────────────────
function openPanel(tech, catId) {
  var cat = CATS.find(function(c) { return c.id === catId; });

  document.getElementById("panel-cat-dot").style.background = cat.color;
  document.getElementById("panel-cat-name").textContent = cat.name;
  document.getElementById("panel-cat-name").style.color = cat.color;
  document.getElementById("panel-title").textContent = tech.name;
  document.getElementById("panel-title").style.color = cat.color;
  document.getElementById("panel-company").textContent = tech.company;
  document.getElementById("panel-desc").textContent = tech.desc;
  document.getElementById("panel-score-num").textContent = tech.score;
  document.getElementById("panel-score-num").style.color = cat.color;
  document.getElementById("score-bar-fill").style.width = tech.score + "%";
  document.getElementById("score-bar-fill").style.background =
    "linear-gradient(90deg, " + cat.glow + ", " + cat.color + ")";
  document.getElementById("panel-year").textContent = "Released  " + tech.year;

  // tags
  var tagsEl = document.getElementById("panel-tags");
  tagsEl.replaceChildren();
  tech.tags.forEach(function(tag) {
    var s = document.createElement("span");
    s.className = "p-tag";
    s.textContent = tag.replace(/-/g, " ");
    s.style.borderColor = cat.color + "44";
    tagsEl.appendChild(s);
  });
  if (tech.open) {
    var s = document.createElement("span");
    s.className = "p-tag oss";
    s.textContent = "open source";
    tagsEl.appendChild(s);
  }

  // related techs (up to 3 siblings from same category)
  var relatedContainer = document.getElementById("panel-related-chips");
  relatedContainer.replaceChildren();
  var siblings = cat.techs.filter(function(t) { return t.name !== tech.name; }).slice(0, 3);
  if (siblings.length > 0) {
    document.getElementById("panel-related").style.display = "block";
    siblings.forEach(function(sib) {
      var chip = document.createElement("span");
      chip.className = "related-chip";
      chip.textContent = sib.name;
      chip.style.borderColor = cat.color + "44";
      chip.addEventListener("pointerup", function(e) {
        if (isRightClick(e)) return;
        e.stopPropagation();
        openPanel(sib, catId);
      });
      relatedContainer.appendChild(chip);
    });
  } else {
    document.getElementById("panel-related").style.display = "none";
  }

  document.getElementById("panel").scrollTop = 0;
  document.getElementById("panel").classList.add("open");
}

function closePanel() {
  document.getElementById("panel").classList.remove("open");
}

function isPanelOpen() {
  return document.getElementById("panel").classList.contains("open");
}

document.getElementById("panel-close").addEventListener("click", function(e) {
  e.stopPropagation(); closePanel();
});
document.getElementById("panel-handle").addEventListener("click", function(e) {
  e.stopPropagation(); closePanel();
});

// swipe down to close panel with velocity detection and scroll awareness
(function() {
  var SCROLL_TOP_THRESHOLD = 5;
  var MIN_SWIPE_DISTANCE = 40;
  var LONG_SWIPE_DISTANCE = 80;
  var FAST_SWIPE_TIME_MS = 300;
  var FAST_SWIPE_MIN_DISTANCE = 30;

  var panelEl = document.getElementById("panel");
  var touchStartY = 0;
  var touchStartTime = 0;

  panelEl.addEventListener("touchstart", function(e) {
    touchStartY = e.touches[0].clientY;
    touchStartTime = Date.now();
  }, { passive: true });

  panelEl.addEventListener("touchend", function(e) {
    var dy = e.changedTouches[0].clientY - touchStartY;
    var dt = Date.now() - touchStartTime;
    var scrollTop = panelEl.scrollTop;
    // only close if panel is scrolled to top and swipe down is sufficient
    if (scrollTop <= SCROLL_TOP_THRESHOLD && dy > MIN_SWIPE_DISTANCE &&
        (dy > LONG_SWIPE_DISTANCE || (dt < FAST_SWIPE_TIME_MS && dy > FAST_SWIPE_MIN_DISTANCE))) {
      closePanel();
    }
  }, { passive: true });
})();

// ── SEARCH ───────────────────────────────────────────────────────
(function() {
  var searchInput = document.getElementById("search-input");
  searchInput.addEventListener("input", function() {
    var query = searchInput.value.trim().toLowerCase();
    d3.selectAll(".tech-node").each(function() {
      var el = d3.select(this);
      var name = (this.getAttribute("data-id") || "").toLowerCase();
      if (!query) {
        el.style("opacity", null);
      } else if (name.indexOf(query) !== -1) {
        el.style("opacity", null);
      } else {
        el.style("opacity", 0.15);
      }
    });
  });
  // prevent touch events from propagating to SVG
  searchInput.addEventListener("pointerdown", function(e) { e.stopPropagation(); });
  searchInput.addEventListener("pointerup", function(e) { e.stopPropagation(); });
  searchInput.addEventListener("click", function(e) { e.stopPropagation(); });
})();

// ── LEGEND STRIP ─────────────────────────────────────────────────
(function() {
  var legendEl = document.getElementById("legend");
  CATS.forEach(function(cat) {
    var chip = document.createElement("div");
    chip.className = "leg-chip";

    var dot = document.createElement("div");
    dot.className = "leg-dot";
    dot.style.background = cat.color;
    chip.appendChild(dot);

    var label = document.createElement("span");
    label.textContent = cat.emoji + " " + cat.name;
    chip.appendChild(label);

    chip.addEventListener("click", function(e) {
      e.stopPropagation();
      closePanel();
      var cn = catNodes.find(function(n) { return n.data.id === cat.id; });
      if (cn) {
        currentFocus = cat.id;
        zoomed = true;
        zoomToNode(cn);
        updateNav(cat.id);
      }
    });
    legendEl.appendChild(chip);
  });
})();

document.addEventListener("keydown", function(e) {
  if (e.key === "Escape") {
    if (isPanelOpen()) {
      closePanel();
    } else if (zoomed) {
      zoomOut();
    }
  }
});

var resizeTimer = null;
window.addEventListener("resize", function() {
  if (resizeTimer) clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function() {
    W = window.innerWidth;
    H = window.innerHeight;
    svg.attr("width", W).attr("height", H);
    buildDefs();
    buildHierarchy();
    drawStarfield();
    drawAll();
    // restore zoom state
    if (zoomed && currentFocus) {
      var cn = catNodes.find(function(n) { return n.data.id === currentFocus; });
      if (cn) {
        zoomToNode(cn);
      } else {
        resetView(false);
      }
    } else {
      resetView(false);
    }
  }, 250);
});

// ═══════════════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════════════
buildDefs();
buildHierarchy();
drawStarfield();
drawAll();
resetView(false);
</script>
</body>
