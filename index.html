<head>

    }

    /* ── Header ─────────────────────────────────────────── */
    #hdr {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      padding: 16px 20px 22px;
      background: linear-gradient(to bottom, rgba(4,4,15,1) 55%, transparent);
      pointer-events: none;
    }
    #hdr h1 {
      font-size: 20px; font-weight: 800; letter-spacing: -0.4px;
      background: linear-gradient(130deg, #fff 0%, #a5b4fc 60%, #818cf8 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    #hdr p { font-size: 11px; color: rgba(255,255,255,0.38); margin-top: 3px; letter-spacing: 0.3px; }

    /* ── Back nav ────────────────────────────────────────── */
    #nav {
      position: fixed; top: 64px; left: 16px; right: 16px; z-index: 100;
      display: flex; align-items: center; gap: 8px; pointer-events: none;
    }
    #back {
      display: none; align-items: center; gap: 5px;
      background: rgba(255,255,255,0.09); border: 1px solid rgba(255,255,255,0.14);
      border-radius: 20px; padding: 6px 14px; font-size: 13px; color: #fff;
      cursor: pointer; pointer-events: all; backdrop-filter: blur(12px);
    }
    #back svg { width: 13px; height: 13px; }
    #navlabel { font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.75); opacity: 0; transition: opacity 0.3s; }

    /* ── Main SVG ─────────────────────────────────────────── */
    #viz { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
    #viz:active { cursor: grabbing; }

    /* ── Legend ──────────────────────────────────────────── */
    #legend {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
      padding: 8px 12px 18px;
      background: linear-gradient(to top, rgba(4,4,15,0.97) 60%, transparent);
      display: flex; gap: 7px; overflow-x: auto; scrollbar-width: none;
      scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch;
    }
    #legend::-webkit-scrollbar { display: none; }
    .lchip {
      flex-shrink: 0; scroll-snap-align: start; display: flex; align-items: center; gap: 5px;
      padding: 5px 11px; background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.11); border-radius: 20px;
      font-size: 11px; font-weight: 500; cursor: pointer; white-space: nowrap;
    }
    .ldot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

    /* ── Detail panel ────────────────────────────────────── */
    #panel {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 300;
      background: rgba(10,10,24,0.97); backdrop-filter: blur(24px);
      border-top: 1px solid rgba(255,255,255,0.09); border-radius: 22px 22px 0 0;
      padding: 0 22px 44px;
      transform: translateY(110%);
      transition: transform 0.38s cubic-bezier(0.32, 0.72, 0, 1);
      max-height: 72vh; overflow-y: auto;
    }
    #panel.open { transform: translateY(0); }
    #ph { width: 38px; height: 4px; background: rgba(255,255,255,0.18); border-radius: 2px; margin: 14px auto 18px; }
    #pclose {
      position: absolute; top: 18px; right: 20px; width: 28px; height: 28px;
      background: rgba(255,255,255,0.1); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 15px; color: rgba(255,255,255,0.7);
    }
    #pcatrow { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    #pcatdot { width: 9px; height: 9px; border-radius: 50%; }
    #pcatname { font-size: 11px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; opacity: 0.55; }
    #ptitle { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 5px; line-height: 1.1; }
    #pco { font-size: 14px; color: rgba(255,255,255,0.48); margin-bottom: 13px; }
    #pdesc { font-size: 15px; line-height: 1.65; color: rgba(255,255,255,0.72); margin-bottom: 18px; }
    #ptags { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 20px; }

    #pmets {

// HELPERS
// ═══════════════════════════════════════════════════════════════
const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const [k,v] of Object.entries(attrs||{})) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
}
const lerp = (a,b,t) => a+(b-a)*t;
const clamp = (v,lo,hi) => Math.min(hi, Math.max(lo, v));
function ease(t) { // cubic ease in-out
  t = clamp(t,0,1);
  return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2;
}
function phyllotaxis(n, R) {
  const g = Math.PI*(3-Math.sqrt(5));
  return Array.from({length:n},(_,i)=>{
    const r = Math.sqrt((i+0.5)/n)*R;
    return [r*Math.cos(i*g), r*Math.sin(i*g)];
  });
}

// ═══════════════════════════════════════════════════════════════
// LAYOUT COMPUTATION
// ═══════════════════════════════════════════════════════════════
const W = window.innerWidth, H = window.innerHeight;
const HDR = 96, LEG = 70;
const AH = H - HDR - LEG;      // usable height
const CX = W/2, CY = HDR + AH/2; // visual center

// Category orbital layout
const orbitR = Math.min(AH/2, W/2) * 0.60;
const catBR  = orbitR * 0.34; // category bubble radius

CATS.forEach((cat,i) => {
  const ang = (i/CATS.length)*2*Math.PI - Math.PI/2;
  cat.ocx = CX + orbitR*Math.cos(ang);
  cat.ocy = CY + orbitR*Math.sin(ang);
  cat.or  = catBR;

  // Tech dot positions in OVERVIEW (inside category bubble)
  const pts = phyllotaxis(cat.techs.length, catBR*0.62);
  const dotR = Math.max(3, catBR*0.10);
  cat.techs.forEach((t,j)=>{
    t.ocx = cat.ocx + pts[j][0];
    t.ocy = cat.ocy + pts[j][1];
    t.or  = dotR * (0.75 + t.score/100*0.25);
  });

  // Tech bubble positions in ZOOMED view
  const zR = Math.min(AH, W) * 0.37;
  const zpts = phyllotaxis(cat.techs.length, zR);
  cat.techs.forEach((t,j)=>{
    t.zcx = CX + zpts[j][0];
    t.zcy = CY + zpts[j][1];
    t.zr  = (t.score/100)*30 + 11;
  });
});

// Peripheral minimap positions — where non-selected cats live at L1
const periR     = Math.min(W, H) * 0.42;
const PERI_R    = Math.max(18, catBR * 0.28); // radius of peripheral bubbles
CATS.forEach((cat, i) => {
  const ang = (i/CATS.length)*2*Math.PI - Math.PI/2;
  cat.pcx = CX + periR * Math.cos(ang);
  cat.pcy = CY + periR * Math.sin(ang);
  cat.pr  = PERI_R;
});

// ═══════════════════════════════════════════════════════════════
// BUILD SVG
// ═══════════════════════════════════════════════════════════════
const svg = document.getElementById('viz');
svg.setAttribute('width', W);
svg.setAttribute('height', H);

// ── Defs (glow filters) ──────────────────────────────────────
const defs = el('defs',{},svg);
CATS.forEach(cat=>{
  const f = el('filter',{id:`g-${cat.id}`,x:'-60%',y:'-60%',width:'220%',height:'220%'},defs);
  el('feGaussianBlur',{stdDeviation:'4',result:'b'},f);
  const m = el('feMerge',{},f);
  el('feMergeNode',{in:'b'},m); el('feMergeNode',{in:'SourceGraphic'},m);
});

// ── Pannable wrapper (all content moves with pan) ────────────
const gWrapper = el('g',{id:'gWrapper'},svg);

// ── Stars ────────────────────────────────────────────────────
const gStars = el('g',{},gWrapper);
for(let i=0;i<200;i++){
  el('circle',{
    cx: Math.random()*W, cy: Math.random()*H,
    r: Math.random()*1.3+0.1, fill:'white',
    opacity: (Math.random()*0.45+0.05).toFixed(2)
  }, gStars);
}

// ── Category group (rings + fill) ───────────────────────────
const gCats = el('g',{id:'gCats'},gWrapper);
// ── Tech bubbles ─────────────────────────────────────────────
const gTechs = el('g',{id:'gTechs'},gWrapper);
// ── Labels (on top) ─────────────────────────────────────────
const gLabels = el('g',{id:'gLabels','pointer-events':'none'},gWrapper);

// Build all elements
CATS.forEach(cat=>{
  // Category: ring + fill circle + emoji + name
  cat._ring = el('circle',{
    cx:cat.ocx, cy:cat.ocy, r:cat.or+3,
    fill:'none', stroke:cat.color, 'stroke-width':'1.5', opacity:'0.22'
  }, gCats);

  cat._fill = el('circle',{
    cx:cat.ocx, cy:cat.ocy, r:cat.or,
    fill:cat.glow, opacity:'0.09',
    stroke:cat.color, 'stroke-width':'1', 'stroke-opacity':'0.3',
    'data-cat':cat.id
  }, gCats);
  cat._fill.style.cursor='pointer';

  cat._emoji = el('text',{
    x:cat.ocx, y:cat.ocy - catBR*0.14,
    'text-anchor':'middle','dominant-baseline':'central',
    'font-size':catBR*0.42, fill:'white', opacity:'0.9'
  }, gLabels);
  cat._emoji.textContent = cat.emoji;

  cat._name = el('text',{
    x:cat.ocx, y:cat.ocy + catBR*0.33,
    'text-anchor':'middle','dominant-baseline':'central',
    'font-size':Math.min(catBR*0.2,12), fill:'white', opacity:'0.65',
    'font-weight':'600'
  }, gLabels);
  cat._name.textContent = cat.name;

  // Tech bubbles
  cat.techs.forEach((t,j)=>{
    t._bub = el('circle',{
      cx:t.ocx, cy:t.ocy, r:t.or,
      fill:cat.color, opacity:'0.88',
      filter:`url(#g-${cat.id})`,
      stroke:'rgba(255,255,255,0.18)','stroke-width':'0.6',
      'data-cat':cat.id,'data-idx':j
    }, gTechs);
    t._bub.style.cursor='pointer';

    t._lbl = el('text',{
      x:t.ocx, y:t.ocy,
      'text-anchor':'middle','dominant-baseline':'central',
      'font-size':'8','font-weight':'700',
      fill:'white', opacity:'0'
    }, gLabels);
    t._lbl.textContent = abbr(t.name);

    // track current animated position
    t._cx=t.ocx; t._cy=t.ocy; t._r=t.or;
    t._lo=0.88; // bubble opacity
  });
});

// Track current animated category centre (used for smooth interruption)
CATS.forEach(cat => { cat._cx=cat.ocx; cat._cy=cat.ocy; cat._cr=cat.or; });

// ── Pulse rings on L0 to signal interactivity ────────────────
let _pulseActive = true;
CATS.forEach(cat => cat._ring.classList.add('ring-pulse'));
function stopPulse() {
  if (!_pulseActive) return;
  _pulseActive = false;
  CATS.forEach(cat => cat._ring.classList.remove('ring-pulse'));
}

// ── One-time "tap to explore" hint ──────────────────────────
(function(){
  const h = document.getElementById('hint');
  const t1 = setTimeout(()=>{ h.style.opacity='1'; }, 1500);
  const t2 = setTimeout(()=>{ h.style.opacity='0'; }, 5500);
  function dismissHint(){ h.style.opacity='0'; clearTimeout(t1); clearTimeout(t2); }
  svg.addEventListener('pointerdown', dismissHint, {once:true});
})();

// ═══════════════════════════════════════════════════════════════
// ANIMATION ENGINE
// ═══════════════════════════════════════════════════════════════
let raf = null;

function runAnim(dur, prep) {
  // prep() sets _from* and _to* on each item, returns a list of "tweens"
  const tweens = prep(); // [{get, set, from, to}]
  const t0 = performance.now();
  if (raf) cancelAnimationFrame(raf);
  function frame(now) {
    const e = ease((now-t0)/dur);
    for (const tw of tweens) tw.set(lerp(tw.from, tw.to, e));
    if ((now-t0) < dur) raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);
}

// ═══════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════
let zoomed = null; // null = overview, else catId

function zoomIn(catId) {
  if (zoomed === catId) return;
  stopPulse();
  const prevZoomed = zoomed;
  zoomed = catId;
  updateNav(catId);
  updateTint(catId);

  const dur = prevZoomed ? 500 : 600; // L1→L1 cross-transition is quicker

  runAnim(dur, () => {
    const tweens = [];
    // Viewport → identity (scale=1, pan=0) so bubbles fill the screen
    const _fpx=panX, _fpy=panY, _fs=scale;
    tweens.push({from:0,to:1,set:t=>{
      panX=lerp(_fpx,0,t); panY=lerp(_fpy,0,t); scale=lerp(_fs,1,t); applyTransform();
    }});

    CATS.forEach(cat=>{
      const isSel = cat.id === catId;
      if (isSel) {
        // ── Selected: fade out category bubble; expand tech bubbles ──
        tweens.push(
          {from:parseFloat(cat._fill.getAttribute('opacity')), to:0, set:v=>cat._fill.setAttribute('opacity',v)},
          {from:parseFloat(cat._ring.getAttribute('opacity')), to:0, set:v=>cat._ring.setAttribute('opacity',v)},
          {from:parseFloat(cat._emoji.getAttribute('opacity')),to:0, set:v=>cat._emoji.setAttribute('opacity',v)},
          {from:parseFloat(cat._name.getAttribute('opacity')), to:0, set:v=>cat._name.setAttribute('opacity',v)},
        );
        cat.techs.forEach(t=>{
          tweens.push(
            {from:t._cx, to:t.zcx, set:v=>{t._cx=v;t._bub.setAttribute('cx',v);t._lbl.setAttribute('x',v);}},
            {from:t._cy, to:t.zcy, set:v=>{t._cy=v;t._bub.setAttribute('cy',v);t._lbl.setAttribute('y',v);}},
            {from:t._r,  to:t.zr,  set:v=>{t._r=v;t._bub.setAttribute('r',Math.max(0.01,v));t._lbl.setAttribute('font-size',Math.max(6,v*0.38));}},
            {from:parseFloat(t._bub.getAttribute('opacity')), to:0.90, set:v=>t._bub.setAttribute('opacity',v)},
            {from:parseFloat(t._lbl.getAttribute('opacity')), to:1,    set:v=>t._lbl.setAttribute('opacity',v)},
          );
        });
      } else {
        // ── Non-selected: shrink to peripheral minimap position ──
        const fromCx=cat._cx, fromCy=cat._cy, fromCr=cat._cr;
        tweens.push(
          {from:fromCx, to:cat.pcx, set:v=>{ cat._cx=v; cat._fill.setAttribute('cx',v); cat._ring.setAttribute('cx',v); }},
          {from:fromCy, to:cat.pcy, set:v=>{ cat._cy=v; cat._fill.setAttribute('cy',v); cat._ring.setAttribute('cy',v); }},
          {from:fromCr, to:cat.pr,  set:v=>{ cat._cr=v; cat._fill.setAttribute('r',v);  cat._ring.setAttribute('r',v+2); }},
          // emoji slides to peripheral centre and shrinks
          {from:parseFloat(cat._emoji.getAttribute('x')),         to:cat.pcx,            set:v=>cat._emoji.setAttribute('x',v)},
          {from:parseFloat(cat._emoji.getAttribute('y')),         to:cat.pcy,            set:v=>cat._emoji.setAttribute('y',v)},
          {from:parseFloat(cat._emoji.getAttribute('font-size')), to:Math.max(10,cat.pr*0.72), set:v=>cat._emoji.setAttribute('font-size',v)},
          // name moves with bubble but fades out (too small to read)
          {from:parseFloat(cat._name.getAttribute('x')), to:cat.pcx, set:v=>cat._name.setAttribute('x',v)},
          {from:parseFloat(cat._name.getAttribute('y')), to:cat.pcy, set:v=>cat._name.setAttribute('y',v)},
          // opacities
          {from:parseFloat(cat._fill.getAttribute('opacity')), to:0.15, set:v=>cat._fill.setAttribute('opacity',v)},
          {from:parseFloat(cat._ring.getAttribute('opacity')), to:0.24, set:v=>cat._ring.setAttribute('opacity',v)},
          {from:parseFloat(cat._emoji.getAttribute('opacity')),to:0.55, set:v=>cat._emoji.setAttribute('opacity',v)},
          {from:parseFloat(cat._name.getAttribute('opacity')), to:0,    set:v=>cat._name.setAttribute('opacity',v)},
        );
        // tech dots contract to peripheral point (become invisible cluster)
        cat.techs.forEach(t=>{
          tweens.push(
            {from:t._cx, to:cat.pcx, set:v=>{t._cx=v;t._bub.setAttribute('cx',v);}},
            {from:t._cy, to:cat.pcy, set:v=>{t._cy=v;t._bub.setAttribute('cy',v);}},
            {from:t._r,  to:0.5,     set:v=>{t._r=v;t._bub.setAttribute('r',Math.max(0.01,v));}},
            {from:parseFloat(t._bub.getAttribute('opacity')), to:0, set:v=>t._bub.setAttribute('opacity',v)},
            {from:parseFloat(t._lbl.getAttribute('opacity')), to:0, set:v=>t._lbl.setAttribute('opacity',v)},
          );
        });
      }
    });
    return tweens;
  });
}

function zoomOut() {
  zoomed = null;
  updateNav(null);
  updateTint(null);

  runAnim(600, () => {
    const tweens = [];
    // Viewport back to L0 fit-to-screen
    const _fpx=panX, _fpy=panY, _fs=scale;
    tweens.push({from:0,to:1,set:t=>{
      panX=lerp(_fpx,initialPanX,t); panY=lerp(_fpy,initialPanY,t);
      scale=lerp(_fs,initialScale,t); applyTransform();
    }});

    CATS.forEach(cat=>{
      // All categories return to their orbital positions
      const fromCx=cat._cx, fromCy=cat._cy, fromCr=cat._cr;
      tweens.push(
        {from:fromCx, to:cat.ocx, set:v=>{ cat._cx=v; cat._fill.setAttribute('cx',v); cat._ring.setAttribute('cx',v); }},
        {from:fromCy, to:cat.ocy, set:v=>{ cat._cy=v; cat._fill.setAttribute('cy',v); cat._ring.setAttribute('cy',v); }},
        {from:fromCr, to:cat.or,  set:v=>{ cat._cr=v; cat._fill.setAttribute('r',v);  cat._ring.setAttribute('r',v+3); }},
        // emoji back to L0 offset position
        {from:parseFloat(cat._emoji.getAttribute('x')),         to:cat.ocx,          set:v=>cat._emoji.setAttribute('x',v)},
        {from:parseFloat(cat._emoji.getAttribute('y')),         to:cat.ocy-catBR*0.14, set:v=>cat._emoji.setAttribute('y',v)},
        {from:parseFloat(cat._emoji.getAttribute('font-size')), to:catBR*0.42,        set:v=>cat._emoji.setAttribute('font-size',v)},
        // name back to L0 offset position
        {from:parseFloat(cat._name.getAttribute('x')), to:cat.ocx,          set:v=>cat._name.setAttribute('x',v)},
        {from:parseFloat(cat._name.getAttribute('y')), to:cat.ocy+catBR*0.33, set:v=>cat._name.setAttribute('y',v)},
        // opacities back to L0 values
        {from:parseFloat(cat._fill.getAttribute('opacity')),  to:0.09, set:v=>cat._fill.setAttribute('opacity',v)},
        {from:parseFloat(cat._ring.getAttribute('opacity')),  to:0.22, set:v=>cat._ring.setAttribute('opacity',v)},
        {from:parseFloat(cat._emoji.getAttribute('opacity')), to:0.9,  set:v=>cat._emoji.setAttribute('opacity',v)},
        {from:parseFloat(cat._name.getAttribute('opacity')),  to:0.65, set:v=>cat._name.setAttribute('opacity',v)},
      );
      // Tech dots return to L0 positions inside category bubble
      cat.techs.forEach(t=>{
        tweens.push(
          {from:t._cx, to:t.ocx, set:v=>{t._cx=v;t._bub.setAttribute('cx',v);t._lbl.setAttribute('x',v);}},
          {from:t._cy, to:t.ocy, set:v=>{t._cy=v;t._bub.setAttribute('cy',v);t._lbl.setAttribute('y',v);}},
          {from:t._r,  to:t.or,  set:v=>{t._r=v;t._bub.setAttribute('r',Math.max(0.01,v));t._lbl.setAttribute('font-size','8');}},
          {from:parseFloat(t._bub.getAttribute('opacity')), to:0.88, set:v=>t._bub.setAttribute('opacity',v)},
          {from:parseFloat(t._lbl.getAttribute('opacity')), to:0,    set:v=>t._lbl.setAttribute('opacity',v)},
        );
      });
    });
    return tweens;
  });
}

// ═══════════════════════════════════════════════════════════════
// PAN + PINCH-ZOOM + TAP
// ═══════════════════════════════════════════════════════════════
let panX = 0, panY = 0, scale = 1;
let initialScale = 1, initialPanX = 0, initialPanY = 0;

// Compute fit-to-screen overview transform from category bounding box
(function(){
  let mnX = Infinity, mnY = Infinity, mxX = -Infinity, mxY = -Infinity;
  CATS.forEach(cat=>{
    mnX = Math.min(mnX, cat.ocx - cat.or);
    mxX = Math.max(mxX, cat.ocx + cat.or);
    mnY = Math.min(mnY, cat.ocy - cat.or);
    mxY = Math.max(mxY, cat.ocy + cat.or);
  });
  const PAD = 36;
  const ccx = (mnX + mxX) / 2, ccy = (mnY + mxY) / 2;
  initialScale = Math.min((W - PAD*2) / (mxX - mnX), (H - PAD*2) / (mxY - mnY));
  initialPanX  = W/2 - ccx * initialScale;
  initialPanY  = H/2 - ccy * initialScale;
  panX = initialPanX; panY = initialPanY; scale = initialScale;
})();

// At L1, viewport scale is clamped to [0.80, 2.5] relative to canonical (scale=1).
// At L0, pan and pinch are disabled — the overview is always at the canonical fit.
const PAN_THRESH   = 6;
const L1_MIN_SCALE = 0.80;   // pinch out past this → snap back to L0
const L1_MAX_SCALE = 2.5;    // pinch in limit at L1
// L1 snap-back fires when scale < 0.80; pinch-release snaps back to 1.0 if ∉ [0.95,1.0]

function applyTransform() {
  gWrapper.setAttribute('transform', `translate(${panX},${panY}) scale(${scale})`);
}
applyTransform();

// ── Pointer state ────────────────────────────────────────────
const _ptrs = new Map();
let _didPan = false;
let _pinchActive = false, _snapPending = false;
let _startX = 0, _startY = 0, _lastX = 0, _lastY = 0;
let _prevDist = 1, _prevMidX = 0, _prevMidY = 0;

svg.addEventListener('pointerdown', e=>{
  svg.setPointerCapture(e.pointerId);
  _ptrs.set(e.pointerId, {x: e.clientX, y: e.clientY});
  if (_ptrs.size === 1) {
    _startX = _lastX = e.clientX;
    _startY = _lastY = e.clientY;
    _didPan = false; _pinchActive = false;
  } else if (_ptrs.size === 2) {
    const [p0, p1] = [..._ptrs.values()];
    _prevDist = Math.hypot(p1.x-p0.x, p1.y-p0.y);
    _prevMidX = (p0.x+p1.x)/2; _prevMidY = (p0.y+p1.y)/2;
    _pinchActive = true;
    _didPan = true; // second finger cancels any pending tap
  }
}, {passive: true});

svg.addEventListener('pointermove', e=>{
  if (!_ptrs.has(e.pointerId)) return;
  _ptrs.set(e.pointerId, {x: e.clientX, y: e.clientY});

  if (_pinchActive && _ptrs.size >= 2) {
    // ── Pinch zoom — only active at L1 ──────────────────────
    if (!zoomed) { return; } // L0: pinch disabled
    const [p0, p1] = [..._ptrs.values()];
    const curDist = Math.hypot(p1.x-p0.x, p1.y-p0.y);
    const curMidX = (p0.x+p1.x)/2, curMidY = (p0.y+p1.y)/2;
    const ds = curDist / _prevDist;
    const newScale = clamp(scale * ds, L1_MIN_SCALE, L1_MAX_SCALE);
    const aDs = newScale / scale;
    panX = curMidX + (panX - _prevMidX) * aDs;
    panY = curMidY + (panY - _prevMidY) * aDs;
    scale = newScale; applyTransform();
    // Pinch-out past threshold → snap back to L0
    if (!_snapPending && scale <= L1_MIN_SCALE) { _snapPending = true; zoomOut(); }
    _prevDist = curDist; _prevMidX = curMidX; _prevMidY = curMidY;

  } else if (!_pinchActive && _ptrs.size === 1) {
    // ── Single-finger pan — only at L1 ──────────────────────
    if (!zoomed) return; // L0: pan disabled
    if (!(e.buttons & 1)) return;
    const dx = e.clientX - _lastX, dy = e.clientY - _lastY;
    _lastX = e.clientX; _lastY = e.clientY;
    if (!_didPan && Math.hypot(e.clientX-_startX, e.clientY-_startY) > PAN_THRESH)
      _didPan = true;
    if (_didPan) {
      // Soft bounds: ±50% of screen
      panX = clamp(panX + dx, -W*0.5, W*0.5);
      panY = clamp(panY + dy, -H*0.5, H*0.5);
      applyTransform();
    }
  }
});

// Double-tap detection for L1→L0 on background tap
let _lastTapTime = 0, _lastTapEl = null;

function _handleTap(target) {
  if (panelOpen()) { closePanel(); return; }
  const catId = target.getAttribute('data-cat');
  const idx   = target.getAttribute('data-idx');
  if (catId && idx !== null && idx !== undefined) {
    const cat = CATS.find(c=>c.id===catId);
    openPanel(cat.techs[+idx], cat);
    _lastTapTime = 0;
  } else if (catId) {
    zoomIn(catId);
    _lastTapTime = 0;
  } else if (zoomed) {
    // Background tap: require double-tap to zoom out (prevents accidental exits)
    const now = Date.now();
    if (now - _lastTapTime < 350) {
      zoomOut();
      _lastTapTime = 0;
    } else {
      _lastTapTime = now;
      _lastTapEl = target;
    }
  }
}

svg.addEventListener('pointerup', e=>{
  _ptrs.delete(e.pointerId);
  if (_ptrs.size < 2 && _pinchActive) {
    _pinchActive = false;
    if (!_snapPending && zoomed && (scale < 0.95 || scale > 1.05)) {
      // Snap back to L1 canonical (scale=1, pan=0) after pinch release
      runAnim(300, ()=>{
        const _fpx=panX,_fpy=panY,_fs=scale;
        return [{from:0,to:1,set:t=>{panX=lerp(_fpx,0,t);panY=lerp(_fpy,0,t);scale=lerp(_fs,1,t);applyTransform();}}];
      });
    }
    _snapPending = false;
    if (_ptrs.size === 1) {
      const [p] = [..._ptrs.values()];
      _lastX = p.x; _lastY = p.y; _didPan = true;
    }
  }
  if (_ptrs.size === 0) {
    if (!_didPan) _handleTap(e.target);
    _didPan = false;
  }
});

svg.addEventListener('pointercancel', e=>{
  _ptrs.delete(e.pointerId);
  if (_ptrs.size < 2) { _pinchActive = false; _snapPending = false; }
});

document.getElementById('back').addEventListener('click', e=>{
  e.stopPropagation(); closePanel(); zoomOut();
});

// ═══════════════════════════════════════════════════════════════
// NAV + TINT
// ═══════════════════════════════════════════════════════════════
function updateNav(catId) {
  const btn = document.getElementById('back');
  const lbl = document.getElementById('navlabel');
  if (!catId) {
    btn.style.display='none'; lbl.style.opacity='0';
  } else {
    btn.style.display='flex';
    const cat = CATS.find(c=>c.id===catId);
    // Breadcrumb: "All Categories › Category Name"
    lbl.textContent = cat ? `All Categories  ›  ${cat.emoji} ${cat.name}` : '';
    lbl.style.opacity='1';
  }
}

function updateTint(catId) {
  const tint = document.getElementById('tint');
  if (!catId) {
    tint.style.opacity = '0';
    tint.style.background = 'transparent';
  } else {
    const cat = CATS.find(c=>c.id===catId);
    if (cat) {
      tint.style.background = cat.color;
      tint.style.opacity = '0.035';
    }
  }
}

// ═══════════════════════════════════════════════════════════════
// PANEL
// ═══════════════════════════════════════════════════════════════
function openPanel(tech, cat) {
  document.getElementById('pcatdot').style.background = cat.color;
  document.getElementById('pcatname').textContent = cat.name;
  document.getElementById('pcatname').style.color  = cat.color;
  document.getElementById('ptitle').textContent = tech.name;
  document.getElementById('ptitle').style.color  = cat.color;
  document.getElementById('pco').textContent    = tech.company;
  document.getElementById('pdesc').textContent  = tech.desc;
  document.getElementById('pscore').textContent = tech.score;
  document.getElementById('pscore').style.color  = cat.color;
  document.getElementById('sfill').style.width   = tech.score+'%';
  document.getElementById('sfill').style.background = `linear-gradient(90deg,${cat.glow},${cat.color})`;
  document.getElementById('pyear').textContent   = `Released  ${tech.year}`;

  const tags = document.getElementById('ptags');
  tags.innerHTML='';
  tech.tags.forEach(tag=>{
    const s = document.createElement('span');
    s.className='ptag'; s.textContent=tag.replace(/-/g,' ');
    s.style.borderColor=cat.color+'44'; tags.appendChild(s);
  });
  if (tech.open) {
    const s = document.createElement('span');
    s.className='ptag oss'; s.textContent='open source'; tags.appendChild(s);
  }
  document.getElementById('panel').classList.add('open');
}

function closePanel() { document.getElementById('panel').classList.remove('open'); }
function panelOpen()  { return document.getElementById('panel').classList.contains('open'); }

document.getElementById('pclose').addEventListener('click', e=>{ e.stopPropagation(); closePanel(); });
document.getElementById('ph').addEventListener('click',    e=>{ e.stopPropagation(); closePanel(); });

let _tsY=0;
document.getElementById('panel').addEventListener('touchstart',e=>{ _tsY=e.touches[0].clientY; },{passive:true});
document.getElementById('panel').addEventListener('touchend',e=>{ if(e.changedTouches[0].clientY-_tsY>60) closePanel(); },{passive:true});

// ═══════════════════════════════════════════════════════════════
// LEGEND
// ═══════════════════════════════════════════════════════════════
const legEl = document.getElementById('legend');
CATS.forEach(cat=>{
  const c = document.createElement('div');
  c.className='lchip';
  c.innerHTML=`<div class="ldot" style="background:${cat.color}"></div>${cat.emoji} ${cat.name}`;
  c.addEventListener('click', e=>{ e.stopPropagation(); closePanel(); zoomIn(cat.id); });
  legEl.appendChild(c);
});

// ═══════════════════════════════════════════════════════════════
// UTIL
// ═══════════════════════════════════════════════════════════════
function abbr(name) {
  const MAP = {
    'GitHub Copilot':'Copilot','Stable Diffusion 3':'SD 3',
    'Optimus Gen 2':'Optimus','Gemini 1.5 Pro':'Gemini 1.5',
    'Gemini 2 Thinking':'Gem Thinking','Flux 1.1 Pro':'Flux 1.1',
    'Midjourney v6':'Midjourney','Runway Gen-3':'Runway',
    'DeepSeek-R1':'DS-R1','DeepSeek-V3':'DS-V3',
    'Project Mariner':'Mariner','AlphaCode 2':'AlphaCode',
    'Figure 02':'Figure','π0 (Pi Zero)':'π0','1X NEO':'1X NEO',
    'Computer Use':'Comp.Use','Gemini 1.5 Pro':'Gemini 1.5',
  };
  return MAP[name] || name;
}
